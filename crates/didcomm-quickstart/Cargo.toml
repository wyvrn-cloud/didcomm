[package]
name = "didcomm-quickstart"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Batteries-included DID generation and default setup for wyvrn-didcomm, mirroring the non-transport parts of didcomm_messaging.quickstart"

[features]
# did:web and did:webvh are network-capable resolvers, on by default for native
# consumers. Both are unavailable (not just "off by default") for wasm32 today: did:web
# needs didcomm-core's DIDResolver trait to support non-Send futures on wasm (a real
# architectural change, not done yet), and did:webvh's dependency didwebvh-rs 0.7.0 has
# an actual upstream bug in its own wasm code path (`Response::chunk()` doesn't exist
# on reqwest's wasm target). The didcomm-wasm crate depends on this crate with
# `default-features = false` to route around both without touching either problem here.
default = ["did-web", "did-webvh"]
did-web = ["dep:didcomm-resolver-web"]
did-webvh = ["dep:didcomm-resolver-webvh"]

[dependencies]
didcomm-core = { path = "../didcomm-core" }
didcomm-crypto-askar = { path = "../didcomm-crypto-askar" }
didcomm-diddoc = { path = "../didcomm-diddoc" }
didcomm-multiformats = { path = "../didcomm-multiformats" }
didcomm-resolver-jwk = { path = "../didcomm-resolver-jwk" }
didcomm-resolver-key = { path = "../didcomm-resolver-key" }
didcomm-resolver-peer = { path = "../didcomm-resolver-peer" }
didcomm-resolver-web = { path = "../didcomm-resolver-web", optional = true }
didcomm-resolver-webvh = { path = "../didcomm-resolver-webvh", optional = true }
askar-crypto = { version = "0.3.7", features = ["std"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"

[dev-dependencies]
pollster = "1"
# examples/message_sizes.rs, examples/interop_peer.rs
async-trait = "0.1"
flate2 = "1"
didcomm-v1 = { path = "../didcomm-v1" }
