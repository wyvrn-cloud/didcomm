[package]
name = "didcomm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-agnostic DIDComm v2 pack/unpack/routing core for wyrvn-didcomm"

[dependencies]
didcomm-diddoc = { path = "../didcomm-diddoc" }
didcomm-multiformats = { path = "../didcomm-multiformats" }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
# "js" is a no-op on native targets and the only way uuid gets randomness on
# wasm32-unknown-unknown (no OS RNG there) -- needed for this crate to build for wasm.
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
pollster = "1"
askar-crypto = { version = "0.3.7", features = ["std"] }
didcomm-crypto-askar = { path = "../didcomm-crypto-askar" }
didcomm-resolver-jwk = { path = "../didcomm-resolver-jwk" }
