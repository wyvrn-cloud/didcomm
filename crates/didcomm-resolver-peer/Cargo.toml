[package]
name = "didcomm-resolver-peer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "did:peer:2 and did:peer:4 resolution for wyvrn-didcomm, mirroring didcomm_messaging.resolver.peer"

[dependencies]
didcomm-core = { path = "../didcomm-core" }
didcomm-multiformats = { path = "../didcomm-multiformats" }
async-trait = "0.1"
# preserve_order: unlike a JWE's protected header (an opaque, already-encoded string
# a receiver never needs to reproduce byte-for-byte), a did:peer:2 identifier's exact
# bytes ARE the interop contract -- two implementations generating a DID from the same
# key material and services must produce the identical string. Cargo unifies this
# feature across the whole workspace's single serde_json build, so every crate gets
# insertion-ordered JSON objects, not just this one; that's a strict improvement
# (human-readable JSON stays in the order a person wrote it) with no downside anywhere
# else in this workspace.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
thiserror = "1"

[dev-dependencies]
pollster = "1"
