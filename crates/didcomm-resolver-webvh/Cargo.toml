[package]
name = "didcomm-resolver-webvh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "did:webvh resolution for wyrvn-didcomm, wrapping the didwebvh-rs crate"

[dependencies]
didcomm-core = { path = "../didcomm-core" }
async-trait = "0.1"
# didwebvh-rs's own network feature (default-on) is what this resolver needs to fetch
# did.jsonl over HTTP(S). Its "ssi" feature (pulling in the ssi crate) is deliberately
# left disabled -- see PLAN.md \S7 for why this workspace avoids that dependency tree.
didwebvh-rs = "0.7"
serde_json = "1"
thiserror = "1"

[dev-dependencies]
affinidi-secrets-resolver = "0.5"
pollster = "1"
