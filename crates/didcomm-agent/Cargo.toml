[package]
name = "didcomm-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A small DIDComm agent runtime on top of didcomm-core: persistent identity, HTTP send/request, mediation and pickup, discover-features/trust-ping responders, and DIDComm v1 with out-of-band/DID Exchange connections"

[dependencies]
didcomm-core = { path = "../didcomm-core" }
didcomm-crypto-askar = { path = "../didcomm-crypto-askar" }
didcomm-multiformats = { path = "../didcomm-multiformats" }
didcomm-quickstart = { path = "../didcomm-quickstart" }
didcomm-resolver-peer = { path = "../didcomm-resolver-peer" }
didcomm-v1 = { path = "../didcomm-v1" }
base64 = "0.22"
askar-crypto = { version = "0.3.7", features = ["std"] }
# Default features pull in rustls (pure Rust TLS), matching didcomm-resolver-web's choice.
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
reqwest-websocket = "0.6"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
didcomm-mediator-core = { path = "../didcomm-mediator-core" }
didcomm-resolver-peer = { path = "../didcomm-resolver-peer" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
