[package]
name = "didcomm-peer-service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTP DIDComm v2 peer used by didcomm-v2-test-util's interop harness -- not a published binding, a test fixture"
publish = false

[[bin]]
name = "didcomm-peer-service"
path = "src/main.rs"

[dependencies]
anyhow = "1"
didcomm-core = { path = "../didcomm-core" }
didcomm-crypto-askar = { path = "../didcomm-crypto-askar" }
didcomm-multiformats = { path = "../didcomm-multiformats" }
didcomm-quickstart = { path = "../didcomm-quickstart" }
didcomm-resolver-peer = { path = "../didcomm-resolver-peer" }
askar-crypto = { version = "0.3.7", features = ["std"] }
axum = "0.8"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
