[package]
name = "didcomm-fast"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Python (PyO3) bindings for wyrvn-didcomm, published as didcomm_fast"

[lib]
name = "didcomm_fast"
crate-type = ["cdylib", "rlib"]

[dependencies]
didcomm-core = { path = "../didcomm-core" }
didcomm-crypto-askar = { path = "../didcomm-crypto-askar" }
# Unlike didcomm-wasm, a native Python extension has no wasm32 Send-future or
# didwebvh-rs wasm bug to route around -- did:web and did:webvh work exactly as they do
# for any other native consumer, so this depends on didcomm-quickstart with its default
# features (matches didcomm-node's reasoning).
didcomm-quickstart = { path = "../didcomm-quickstart" }
askar-crypto = { version = "0.3.7", features = ["std"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
pythonize = "0.29"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
